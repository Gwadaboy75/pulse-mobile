name: Bug report
description: Something in Pulse Mobile is wrong or broken.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please never paste real health data or exported files. Reproduce with demo data if you can.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you see, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Tap ...
        3. See ...
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Data
      options:
        - Demo data
        - Health Connect (real data)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: The release you installed (for example the APK's name), or the commit you built.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone and Android version
      placeholder: Pixel 8, Android 16
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Screenshots or `adb logcat` output. Check them for personal data first.
