plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'pulse.googleauth'
version = '0.1.0'

android {
  namespace "pulse.googleauth"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  // Identity.getAuthorizationClient: Google's Authorization API. It brings play-services-base (GoogleApiAvailability),
  // kotlinx-coroutines-play-services (Task.await) and androidx.activity (IntentSenderRequest).
  implementation "com.google.android.gms:play-services-auth:22.0.0"
}
